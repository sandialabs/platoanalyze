.setup-local-spack-installation:
  stage: setup-spack
  # TODO: Replace below with ${SPACK_RESOURCE}, there's currently a bug
  # preventing expansion of nested variables.
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  script:
    - mkdir -p ${SPACK_DIR}
    - mkdir -p ${SPACK_MIRROR_DIR}
    - cd ${SPACK_DIR}
    - |
      if [ -d "./spack" ] 
      then
        git -C ./spack pull
        source spack/share/spack/setup-env.sh
        spack env activate --without-view .
        spack remove -af
      else
        git clone ${SPACK_REPO}
        source spack/share/spack/setup-env.sh
        spack env create -d .
        spack env activate --without-view .
        spack mirror add mirror ${SPACK_MIRROR_DIR}
      fi
    - |
      if [ -d "./platoengine" ] 
      then 
        pushd ./platoengine
        git remote set-url origin ${PLATOENGINE_REPO} # Update token
        git checkout ${PLATOENGINE_BRANCH}
        git pull 
        popd
      else
        git clone -b ${PLATOENGINE_BRANCH} ${PLATOENGINE_REPO}
      fi
    - spack config add config:install_tree:padded_length:256

.build-and-cache-pe-dependencies:
  stage: build-engine
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  timeout: 4 hours
  before_script:
    - echo "Building dependencies for branch ${CI_COMMIT_BRANCH}"
    - cd ${SPACK_DIR}
    - source spack/share/spack/setup-env.sh
  script:
    - spack env activate --without-view .
    - spack buildcache update-index -d ${SPACK_MIRROR_DIR}
    - spack uninstall -ay platoanalyze || true
    - spack uninstall -ay platoengine || true
    - spack add platoengine@develop${PLATO_ENGINE_OPTIONS} ${THIRD_PARTY_OPTIONS_COMMON}
    - spack develop --path ./platoengine platoengine@develop
    - spack concretize -f
    - spack install --use-cache --no-check-signature --only dependencies
    - spack install --overwrite --no-cache --only package

.build-and-cache-pa-dependencies:
  stage: build-dependencies
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  timeout: 4 hours
  before_script:
    - echo "Building dependencies for branch ${CI_COMMIT_BRANCH}"
    - cd ${SPACK_DIR}
    - source spack/share/spack/setup-env.sh
  script:
    - spack env activate --without-view .
    - spack remove -af
    - spack add platoanalyze@develop${PLATO_ANALYZE_OPTIONS} ^platoengine@develop${PLATO_ENGINE_OPTIONS} ${THIRD_PARTY_OPTIONS_FOR_PA} ${THIRD_PARTY_OPTIONS_COMMON}
    - spack develop --path ${CI_PROJECT_DIR} platoanalyze@develop
    - spack concretize -f
    - spack install --use-cache --no-check-signature --only dependencies

.build-install-platoanalyze:
  stage: build-install
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  before_script:
    - echo "Building platoanalyze for branch ${CI_COMMIT_BRANCH}"
#    - git submodule init
#    - git submodule update # Skip regression and verification tests for now
    - cd ${SPACK_DIR}
    - source spack/share/spack/setup-env.sh
  script: 
    - spack env activate --without-view .
    - spack install --overwrite --no-cache --only package
    - spack buildcache create --allow-root --rebuild-index --unsigned --only dependencies -d ${SPACK_MIRROR_DIR} platoanalyze
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/spack-build-out.txt"
  cache:
    key: pa_build_cache_${CI_PIPELINE_ID}
    untracked: true
    policy: push

.test-platoanalyze:
  stage: test
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  before_script:
    - cd ${SPACK_DIR}
    - source spack/share/spack/setup-env.sh
  script: 
    - spack env activate --without-view .
    - spack load platoanalyze
    - export PLATOANALYZE_BUILD_DIR=$(spack location -b platoanalyze)
    - cd ${PLATOANALYZE_BUILD_DIR}
    - ctest --output-junit test_report.xml || FAILURE=true
    - mkdir -p ${CI_PROJECT_DIR}/jobs_scratch_dir/
    - cp test_report.xml ${CI_PROJECT_DIR}/jobs_scratch_dir/
    - if [ ${FAILURE} == "true" ]; then (exit 1); fi # Fail if ctest failed
  artifacts:
    when: always
    paths:
      - "${CI_PROJECT_DIR}/jobs_scratch_dir/test_report.xml"
    reports:
      junit: 
        - "${CI_PROJECT_DIR}/jobs_scratch_dir/test_report.xml"
  cache:
    key: pa_build_cache_${CI_PIPELINE_ID}
    untracked: true
    policy: pull

.clean-temporary-build-cache:
  stage: clean-up
  resource_group: ${TRIGGER_SPACK_DIR}_${CONFIGURATION}
  when: always
  rules:
    - if: $CLEAN_CACHE == "true"
  script:
    - rm -rf /home/gitlab-runner/cache/${CI_PROJECT_PATH}/pa_build_cache_*${CI_PIPELINE_ID}*
